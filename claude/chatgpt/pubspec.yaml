name: flappy_bird
description: A polished Flappy Bird clone built with pure Flutter — no game engines, no external packages.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # No external assets needed — all graphics are drawn programmatically.
